<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>hitcount + Turnstile</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; padding: 24px 16px; font: 15px/1.5 system-ui, sans-serif; max-width: 720px; }
    #log { font: 12px/1.45 ui-monospace, Menlo, monospace; padding-left: 18px; }
  </style>
</head>
<body>
  <h1>hitcount + Cloudflare Turnstile</h1>
  <p>Cloudflare test sitekeys: the first always passes, the second always asks for a click.</p>
  <div class="cf-turnstile" id="auto-pass" data-sitekey="1x00000000000000000000AA"></div>
  <div id="needs-click"></div>
  <h2>Events</h2>
  <ol id="log"></ol>

  <script>
    window.hitcount = window.hitcount || function () { (hitcount.q = hitcount.q || []).push(arguments); };
    hitcount('on', 'event', (event) => {
      const item = document.createElement('li');
      item.textContent = `${event.name} ${JSON.stringify(event.props)}`;
      document.getElementById('log').append(item);
    });
  </script>
  <script src="../dist/hitcount.full.min.js" data-site="turnstile-demo" data-plugins="pageviews,turnstile,cloudflare" data-debug></script>
  <script>
    window.onTurnstileLoad = () => turnstile.render('#needs-click', { sitekey: '3x00000000000000000000FF' });
  </script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onTurnstileLoad" async defer></script>
</body>
</html>
