<!doctype html>
<title>Media</title>
<p>Plays 1.2 s of generated silence through the media plugin. If your browser blocks autoplay, press play.</p>
<audio id="podcast" data-analy="podcast" controls muted></audio>
<script src="/dist/analy.full.min.js" data-site="harness" data-plugins="pageviews,media" data-endpoint="/collect?fixture=media"></script>
<script>
  // A WAV of silence built in the page, so the fixture needs no media file.
  function silentWav(seconds, rate = 8000) {
    const samples = Math.round(seconds * rate);
    const view = new DataView(new ArrayBuffer(44 + samples));
    const text = (at, value) => [...value].forEach((c, i) => view.setUint8(at + i, c.charCodeAt(0)));
    text(0, 'RIFF'); view.setUint32(4, 36 + samples, true); text(8, 'WAVE'); text(12, 'fmt ');
    view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
    view.setUint32(24, rate, true); view.setUint32(28, rate, true); view.setUint16(32, 1, true); view.setUint16(34, 8, true);
    text(36, 'data'); view.setUint32(40, samples, true);
    for (let i = 0; i < samples; i++) view.setUint8(44 + i, 128);
    return URL.createObjectURL(new Blob([view.buffer], { type: 'audio/wav' }));
  }
  const audio = document.getElementById('podcast');
  audio.muted = true;
  audio.src = silentWav(1.2);
  // Browsers may refuse to start without a click; the controls are there for that case.
  audio.play().catch(() => {});
</script>
